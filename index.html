<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Goodwall</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0f766e 0%, #14532d 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            max-width: 700px;
        }

        h1 {
            color: #0f172a;
            margin: 0;
            font-size: 2.5em;
        }

        p {
            color: #334155;
            font-size: 1.2em;
            margin: 14px 0 0 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello Goodwall</h1>
        <p>I'm Sylivia Opieba from Kenya</p>
        <p>I am with Africa Centre for Climate Change and Environmental Sustainability</p>
    </div>
</body>
</html>
