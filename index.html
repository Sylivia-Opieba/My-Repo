<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Goodwall</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            color: #333;
            margin: 0;
            font-size: 2.5em;
        }
        
        p {
            color: #666;
            font-size: 1.2em;
            margin: 15px 0 0 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello Goodwall</h1>
        <p>I'm Sylivia Opieba from Kenya</p>
    </div>
</body>
</html>
